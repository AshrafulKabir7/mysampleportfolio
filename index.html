    <!-- Theme, motion pause and the one-time intro flag, before first paint (no flash) -->
    <script>
      (function () {
        var d = document.documentElement;
        var q = location.search;
        var paused = false;
        try {
          if (q.indexOf("theme=light") > -1 || (q.indexOf("theme=dark") < 0 && localStorage.getItem("aka-theme") === "light")) {
            d.classList.remove("dark");
            d.classList.add("light");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#f3f1ec");
          }
          paused = localStorage.getItem("aka-motion") === "paused";
          if (paused) d.classList.add("motion-paused");
        } catch (e) {}
        // If the app bundle never runs, reveal content left in its entrance state (main.tsx clears this)
        window.__akaReveal = setTimeout(function () {
          d.classList.add("reveal-all");
          d.classList.remove("intro-pending");
        }, 3500);
        try {
          var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (!reduce && !paused && q.indexOf("nointro") < 0 && !sessionStorage.getItem("aka-intro")) {
            d.classList.add("intro-pending");
            var skip = function () {
              d.classList.remove("intro-pending");
            };
            // skippable before hydration too; Intro.tsx takes over these once it mounts
            window.__akaIntroSkip = skip;
            window.addEventListener("keydown", function (e) {
              if (e.key === "Escape" && !window.__akaIntroMounted) skip();
            });
            window.addEventListener("pointerdown", function () {
              if (!window.__akaIntroMounted) skip();
            });
            // failsafe: never trap the page behind the intro; Intro.tsx clears and re-arms it
            window.__akaIntroT = setTimeout(skip, 4000);
          }
        } catch (e) {}
      })();
    </script>
